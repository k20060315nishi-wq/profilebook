<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Profile Book</title>

<style>
body, html {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* レイアウト */
#viewer {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ページ */
.page {
    width: 100vw;
    height: 100vh;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* ボタン */
.nav {
    position: fixed;
    bottom: 25px;
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    color: white;
}
#prev { left: 20px; }
#next { right: 20px; }

/* ページ表示 */
#overlay {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 6px 20px;
    border-radius: 999px;
}
</style>
</head>

<body>

<div id="viewer">
    <div id="wrapper">
        <div class="page">
            <img id="img" src="">
        </div>
    </div>
</div>

<button id="prev" class="nav">←</button>
<button id="next" class="nav">→</button>

<div id="overlay">
    <span id="page">1</span> / <span id="total"></span>
</div>

<script>
const TOTAL = 21;
const PREFIX = 'page';
const EXT = '.png';

let current = 1;

// ズーム
let scale = 1;
let x = 0;
let y = 0;

// タッチ
let startX = 0;
let endX = 0;
let lastTap = 0;

const img = document.getElementById('img');
const overlay = document.getElementById('overlay');

// 初期
document.getElementById('total').textContent = TOTAL;

// 表示更新
function render() {
    img.src = `${PREFIX}${current}${EXT}`;
    document.getElementById('page').textContent = current;
}

// ページ移動
function nav(dir) {
    if (scale > 1.1) return;

    if (dir === 'next' && current < TOTAL) current++;
    if (dir === 'prev' && current > 1) current--;

    render();
}

// ボタン
document.getElementById('next').onclick = () => nav('next');
document.getElementById('prev').onclick = () => nav('prev');

// スワイプ + ダブルタップ
const viewer = document.getElementById('viewer');

viewer.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
});

viewer.addEventListener('touchend', e => {
    endX = e.changedTouches[0].clientX;
    const diff = endX - startX;
    const now = Date.now();

    // スワイプ
    if (Math.abs(diff) > 50 && scale <= 1.1) {
        if (diff < 0) nav('next');
        else nav('prev');
        return;
    }

    // ダブルタップ
    if (now - lastTap < 300) {
        if (scale > 1) {
            scale = 1;
            x = y = 0;
        } else {
            scale = 2;
        }
        updateTransform();
    }

    lastTap = now;
});

// ピンチズーム
let lastDist = 0;

viewer.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);

        if (lastDist) {
            scale *= dist / lastDist;
            scale = Math.max(1, Math.min(scale, 4));
            updateTransform();
        }
        lastDist = dist;
    }
}, { passive: false });

viewer.addEventListener('touchend', () => {
    lastDist = 0;
});

// 変形
function updateTransform() {
    document.getElementById('wrapper').style.transform =
        `translate(${x}px, ${y}px) scale(${scale})`;
}

// 初期表示
render();
</script>

</body>
</html>
