<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Profile Book</title>

<style>
body, html {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#wrapper {
    will-change: transform;
    transform-origin: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    transition: opacity 0.25s ease;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.nav {
    position: fixed;
    bottom: 25px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1000; /* 十分に高い値 */
    transition: opacity 0.3s, transform 0.2s;
    touch-action: auto; /* ボタン上ではブラウザのデフォルト動作を許可 */
}

.nav:active {
    transform: scale(0.9);
    background: rgba(255,255,255,0.4);
}

#prev { left: 20px; }
#next { right: 20px; }

#overlay {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 900;
}
</style>
</head>

<body>

<div id="viewer">
    <div id="wrapper">
        <div class="page">
            <img id="img" alt="Profile Page">
        </div>
    </div>
</div>

<button id="prev" class="nav" aria-label="Previous page">←</button>
<button id="next" class="nav" aria-label="Next page">→</button>

<div id="overlay">
    <span id="page">1</span> / <span id="total"></span>
</div>

<script>
const TOTAL = 21;
const PREFIX = 'page';
const EXT = '.png';

let current = 1;

/* 状態管理 */
let scale = 1;
let x = 0, y = 0;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let lastTap = 0;
let lastDist = 0;
let isDragging = false;
let isMultiTouch = false;

const img = document.getElementById('img');
const wrapper = document.getElementById('wrapper');
const viewer = document.getElementById('viewer');
const overlay = document.getElementById('overlay');

document.getElementById('total').textContent = TOTAL;

/* プリロード */
const cache = {};
function preload(n) {
    if (n < 1 || n > TOTAL) return;
    const src = `${PREFIX}${n}${EXT}`;
    if (!cache[src]) {
        const i = new Image();
        i.src = src;
        cache[src] = i;
    }
}

/* 描画 */
function render() {
    img.style.opacity = 0;
    // ページ遷移時は必ずズームをリセット
    resetZoom();

    setTimeout(() => {
        img.src = `${PREFIX}${current}${EXT}`;
        img.onload = () => { img.style.opacity = 1; };
        document.getElementById('page').textContent = current;
        preload(current + 1);
        preload(current - 1);
        showOverlay();
    }, 50);
}

function showOverlay() {
    overlay.style.opacity = 1;
    clearTimeout(window.overlayTimer);
    window.overlayTimer = setTimeout(() => { overlay.style.opacity = 0; }, 2000);
}

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function update() {
    const limitX = Math.max(0, (img.offsetWidth * scale - window.innerWidth) / 2);
    const limitY = Math.max(0, (img.offsetHeight * scale - window.innerHeight) / 2);

    x = clamp(x, -limitX, limitX);
    y = clamp(y, -limitY, limitY);

    wrapper.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}

function resetZoom() {
    scale = 1;
    x = 0; y = 0;
    update();
}

function nav(dir) {
    if (dir === 'next') current = current === TOTAL ? 1 : current + 1;
    else current = current === 1 ? TOTAL : current - 1;
    render();
}

/* ボタンイベントの強化 */
const btns = document.querySelectorAll('.nav');
btns.forEach(btn => {
    // touchstartを背後に伝播させない
    btn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
    }, { passive: true });

    btn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const direction = e.currentTarget.id === 'next' ? 'next' : 'prev';
        nav(direction);
    };
});

/* ビューワーのタッチ操作 */
viewer.addEventListener('touchstart', e => {
    // ボタン上でのタッチは何もしない（伝播停止しているが一応）
    if (e.target.closest('.nav')) return;

    if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lastX = x;
        lastY = y;
        isDragging = scale > 1.05;
    } else if (e.touches.length === 2) {
        isMultiTouch = true;
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastDist = Math.hypot(dx, dy);
    }
}, { passive: false });

viewer.addEventListener('touchmove', e => {
    // 拡大中または2本指操作時は、ブラウザのスクロールやバウンスを防止
    if (scale > 1.05 || e.touches.length > 1) {
        e.preventDefault();
    }

    if (e.touches.length === 1 && isDragging) {
        x = lastX + (e.touches[0].clientX - startX);
        y = lastY + (e.touches[0].clientY - startY);
        update();
    }

    if (e.touches.length === 2) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        const dist = Math.hypot(dx, dy);

        if (lastDist) {
            const delta = dist / lastDist;
            const prevScale = scale;
            scale = Math.min(Math.max(1, scale * delta), 4);
            
            const factor = scale / prevScale;
            const touchX = midX - window.innerWidth / 2;
            const touchY = midY - window.innerHeight / 2;
            
            x = touchX - (touchX - x) * factor;
            y = touchY - (touchY - y) * factor;
            update();
        }
        lastDist = dist;
    }
}, { passive: false });

viewer.addEventListener('touchend', e => {
    const now = Date.now();

    if (e.changedTouches.length === 1) {
        // ボタン上での終了判定をスキップ
        if (e.target.closest('.nav')) return;

        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const diffX = endX - startX;
        const diffY = endY - startY;

        // ダブルタップ
        if (now - lastTap < 300 && Math.hypot(diffX, diffY) < 10) {
            if (scale > 1.05) {
                resetZoom();
            } else {
                const touchX = startX - window.innerWidth / 2;
                const touchY = startY - window.innerHeight / 2;
                scale = 2.5;
                x = -touchX * scale;
                y = -touchY * scale;
                update();
            }
            e.preventDefault();
            isMultiTouch = false;
        } 
        // スワイプ（等倍時のみ）
        else if (!isMultiTouch && scale <= 1.05 && Math.abs(diffX) > 60) {
            diffX < 0 ? nav('next') : nav('prev');
        }
    }

    if (e.touches.length === 0) {
        setTimeout(() => { isMultiTouch = false; }, 100);
        isDragging = false;
        lastDist = 0;
    }
    lastTap = now;
});

/* 初期起動 */
render();
window.addEventListener('resize', resetZoom);
</script>

</body>
</html>
