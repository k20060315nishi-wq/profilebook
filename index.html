<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Profile Book</title>

<style>
body, html {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#wrapper {
    will-change: transform;
    transform-origin: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    transition: opacity 0.25s ease;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.nav {
    position: fixed;
    bottom: 25px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    transition: opacity 0.3s, transform 0.2s;
}

.nav:active {
    transform: scale(0.9);
    background: rgba(255,255,255,0.3);
}

#prev { left: 20px; }
#next { right: 20px; }

#overlay {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 90;
}

/* ズーム中はボタンを隠す */
.is-zoomed .nav {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="viewer">
    <div id="wrapper">
        <div class="page">
            <img id="img" alt="Profile Page">
        </div>
    </div>
</div>

<button id="prev" class="nav">←</button>
<button id="next" class="nav">→</button>

<div id="overlay">
    <span id="page">1</span> / <span id="total"></span>
</div>

<script>
const TOTAL = 21;
const PREFIX = 'page';
const EXT = '.png';

let current = 1;

/* 状態管理 */
let scale = 1;
let x = 0, y = 0;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let lastTap = 0;
let lastDist = 0;
let isDragging = false;
let isMultiTouch = false;

const img = document.getElementById('img');
const wrapper = document.getElementById('wrapper');
const viewer = document.getElementById('viewer');
const overlay = document.getElementById('overlay');

document.getElementById('total').textContent = TOTAL;

/* プリロード */
const cache = {};
function preload(n) {
    if (n < 1 || n > TOTAL) return;
    const src = `${PREFIX}${n}${EXT}`;
    if (!cache[src]) {
        const i = new Image();
        i.src = src;
        cache[src] = i;
    }
}

/* 表示レンダリング */
function render() {
    img.style.opacity = 0;
    setTimeout(() => {
        img.src = `${PREFIX}${current}${EXT}`;
        img.onload = () => { img.style.opacity = 1; };
        document.getElementById('page').textContent = current;
        preload(current + 1);
        preload(current - 1);
        showOverlay();
        resetZoom();
    }, 100);
}

function showOverlay() {
    overlay.style.opacity = 1;
    clearTimeout(window.overlayTimer);
    window.overlayTimer = setTimeout(() => { overlay.style.opacity = 0; }, 2000);
}

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function update() {
    const rect = img.getBoundingClientRect();
    
    // 現在のスケールでの画像のはみ出し量を計算
    // 画像の元サイズではなく、CSSで画面内に収まっている時のサイズを基準にする
    const limitX = Math.max(0, (img.offsetWidth * scale - window.innerWidth) / 2);
    const limitY = Math.max(0, (img.offsetHeight * scale - window.innerHeight) / 2);

    x = clamp(x, -limitX, limitX);
    y = clamp(y, -limitY, limitY);

    wrapper.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    viewer.classList.toggle('is-zoomed', scale > 1.05);
}

function resetZoom() {
    scale = 1;
    x = 0; y = 0;
    update();
}

function nav(dir) {
    if (scale > 1.05) return;
    if (dir === 'next') current = current === TOTAL ? 1 : current + 1;
    else current = current === 1 ? TOTAL : current - 1;
    render();
}

document.getElementById('next').onclick = (e) => { e.stopPropagation(); nav('next'); };
document.getElementById('prev').onclick = (e) => { e.stopPropagation(); nav('prev'); };

/* タッチ操作 */
viewer.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lastX = x;
        lastY = y;
        isDragging = scale > 1.05;
    } else if (e.touches.length === 2) {
        isMultiTouch = true;
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastDist = Math.hypot(dx, dy);
    }
}, { passive: false });

viewer.addEventListener('touchmove', e => {
    if (scale > 1.05 || e.touches.length > 1) e.preventDefault();

    if (e.touches.length === 1 && isDragging) {
        x = lastX + (e.touches[0].clientX - startX);
        y = lastY + (e.touches[0].clientY - startY);
        update();
    }

    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);

        if (lastDist) {
            const delta = dist / lastDist;
            const newScale = Math.min(Math.max(1, scale * delta), 4);
            // ズーム中心を固定する簡易処理
            scale = newScale;
            update();
        }
        lastDist = dist;
    }
}, { passive: false });

viewer.addEventListener('touchend', e => {
    const now = Date.now();

    if (e.changedTouches.length === 1) {
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const diffX = endX - startX;
        const diffY = endY - startY;

        // ダブルタップ判定
        if (now - lastTap < 300 && Math.hypot(diffX, diffY) < 10) {
            if (scale > 1.05) {
                resetZoom();
            } else {
                // タップした場所を中心に拡大
                const rect = img.getBoundingClientRect();
                // 画面中央からのタップ位置のオフセット
                const touchX = startX - window.innerWidth / 2;
                const touchY = startY - window.innerHeight / 2;

                scale = 2.5;
                // タップ位置が中央に来るようにずらす
                x = -touchX * scale;
                y = -touchY * scale;
                update();
            }
            e.preventDefault();
            // ダブルタップ成立時はマルチタッチフラグ等をリセット
            isMultiTouch = false;
        } 
        // スワイプ判定（マルチタッチ中でない場合のみ）
        else if (!isMultiTouch && scale <= 1.05 && Math.abs(diffX) > 60) {
            diffX < 0 ? nav('next') : nav('prev');
        }
    }

    if (e.touches.length === 0) {
        // 全ての指が離れてから一定時間後にマルチタッチフラグを戻す
        // 指を離す瞬間のシングルタップ誤爆を防ぐ
        setTimeout(() => { isMultiTouch = false; }, 100);
        isDragging = false;
        lastDist = 0;
    }
    lastTap = now;
});

/* 初期起動 */
render();
window.addEventListener('resize', resetZoom);
</script>

</body>
</html>
