<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wedding Profile Book</title>

<style>
body, html {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    perspective: 1000px;
}

#wrapper {
    will-change: transform;
    transform-origin: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    transition: opacity 0.3s ease;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    pointer-events: none;
}

.nav {
    position: fixed;
    bottom: calc(30px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1000;
    transition: all 0.2s ease;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.nav:active {
    transform: scale(0.85);
    background: rgba(255,255,255,0.4);
}

#prev { left: 24px; }
#next { right: 24px; }

#overlay {
    position: fixed;
    top: calc(30px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 900;
    backdrop-filter: blur(5px);
}
</style>
</head>

<body>

<div id="viewer">
    <div id="wrapper">
        <div class="page">
            <img id="img" alt="Profile Page">
        </div>
    </div>
</div>

<button id="prev" class="nav">←</button>
<button id="next" class="nav">→</button>

<div id="overlay">
    <span id="page">1</span> / <span id="total"></span>
</div>

<script>
const TOTAL = 21;
const PREFIX = 'page';
const EXT = '.png';

let current = 1;
let scale = 1;
let x = 0, y = 0;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let lastTap = 0;
let lastDist = 0;
let isDragging = false;
let isMultiTouch = false;

const img = document.getElementById('img');
const wrapper = document.getElementById('wrapper');
const viewer = document.getElementById('viewer');
const overlay = document.getElementById('overlay');

document.getElementById('total').textContent = TOTAL;

/* Preload images */
const cache = {};
function preload(n) {
    if (n < 1 || n > TOTAL) return;
    const src = `${PREFIX}${n}${EXT}`;
    if (!cache[src]) {
        const i = new Image();
        i.src = src;
        cache[src] = i;
    }
}

/* Page Rendering */
function render() {
    img.style.opacity = 0;
    resetZoom(true);

    setTimeout(() => {
        img.src = `${PREFIX}${current}${EXT}`;
        img.onload = () => {
            img.style.opacity = 1;
            showOverlay();
            preload(current + 1);
            preload(current - 1);
        };
        document.getElementById('page').textContent = current;
    }, 150);
}

function showOverlay() {
    overlay.style.opacity = 1;
    clearTimeout(window.overlayTimer);
    window.overlayTimer = setTimeout(() => { overlay.style.opacity = 0; }, 2500);
}

/* Core Transform Logic with GPU Acceleration */
function update(useClamp = true, animate = false) {
    if (useClamp) {
        const limitX = Math.max(0, (img.offsetWidth * scale - window.innerWidth) / 2);
        const limitY = Math.max(0, (img.offsetHeight * scale - window.innerHeight) / 2);
        x = Math.max(-limitX, Math.min(limitX, x));
        y = Math.max(-limitY, Math.min(limitY, y));
    }

    // 操作中はアニメーションオフ、指を離した時などは滑らかに
    wrapper.style.transition = animate ? 'transform 0.3s cubic-bezier(0.15, 0, 0.15, 1)' : 'none';
    wrapper.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
}

function resetZoom(animate = false) {
    scale = 1;
    x = 0; y = 0;
    update(true, animate);
}

function nav(dir) {
    if (dir === 'next') current = current === TOTAL ? 1 : current + 1;
    else current = current === 1 ? TOTAL : current - 1;
    render();
}

/* Button setup with stopPropagation */
const setupNav = () => {
    const btns = document.querySelectorAll('.nav');
    btns.forEach(btn => {
        btn.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
        btn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            nav(btn.id === 'next' ? 'next' : 'prev');
        };
    });
};
setupNav();

/* Touch events */
viewer.addEventListener('touchstart', e => {
    if (e.target.closest('.nav')) return;

    if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lastX = x;
        lastY = y;
        isDragging = scale > 1.01;
    } else if (e.touches.length === 2) {
        isMultiTouch = true;
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastDist = Math.hypot(dx, dy);
    }
}, { passive: false });

viewer.addEventListener('touchmove', e => {
    // 拡大中または2本指時はブラウザの挙動を抑制
    if (scale > 1.01 || e.touches.length > 1) {
        e.preventDefault();
    }

    if (e.touches.length === 1 && isDragging) {
        x = lastX + (e.touches[0].clientX - startX);
        y = lastY + (e.touches[0].clientY - startY);
        update(false); 
    }

    if (e.touches.length === 2) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;
        const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

        if (lastDist) {
            const delta = dist / lastDist;
            const prevScale = scale;
            scale = Math.min(Math.max(0.8, scale * delta), 6);
            
            const factor = scale / prevScale;
            const touchX = midX - window.innerWidth / 2;
            const touchY = midY - window.innerHeight / 2;
            
            // 指と指の中点を維持して拡大
            x = touchX - (touchX - x) * factor;
            y = touchY - (touchY - y) * factor;
            update(false); 
        }
        lastDist = dist;
    }
}, { passive: false });

viewer.addEventListener('touchend', e => {
    const now = Date.now();

    // 指を離した際のクランプ補正（等倍より小さければリセット、大きすぎれば最大値へ）
    if (e.touches.length < 2) {
        if (scale < 1) resetZoom(true);
        else if (scale > 4) { scale = 4; update(true, true); }
        else update(true, true);
    }

    if (e.changedTouches.length === 1) {
        if (e.target.closest('.nav')) return;

        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const diffX = endX - startX;
        const diffY = endY - startY;

        // Double Tap
        if (now - lastTap < 300 && Math.hypot(diffX, diffY) < 15) {
            if (scale > 1.1) {
                resetZoom(true);
            } else {
                const touchX = startX - window.innerWidth / 2;
                const touchY = startY - window.innerHeight / 2;
                const prevScale = scale;
                scale = 3;
                
                // タップ地点を中心に拡大
                x = touchX - (touchX - x) * (scale / prevScale);
                y = touchY - (touchY - y) * (scale / prevScale);
                update(true, true);
            }
            e.preventDefault();
            isMultiTouch = false;
        } 
        // Swipe Navigation
        else if (!isMultiTouch && scale <= 1.01 && Math.abs(diffX) > 50) {
            diffX < 0 ? nav('next') : nav('prev');
        }
    }

    if (e.touches.length === 0) {
        setTimeout(() => { isMultiTouch = false; }, 150);
        isDragging = false;
        lastDist = 0;
    }
    lastTap = now;
});

render();
window.addEventListener('resize', () => resetZoom(false));
</script>

</body>
</html>
